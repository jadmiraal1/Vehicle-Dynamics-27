name: CI

# Runs on every push and pull request, so a branch gets the full test result
# even when the author has no MATLAB at hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # Seconds, no MATLAB, no tire data: consistency and artifact bookkeeping.
  # ------------------------------------------------------------------------
  checks:
    name: consistency (no MATLAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ci_staleness diffs against the base commit

      - name: Repo consistency
        run: python3 tests/ci_checks.py

      - name: Artifact staleness bookkeeping
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tests/ci_staleness.py

  # ------------------------------------------------------------------------
  # The MATLAB models. On a public repository setup-matlab is licensed for
  # GitHub-hosted runners; a private repository needs a MATLAB batch
  # licensing token (see the matlab-actions documentation).
  # The Optimization Toolbox is installed so CI takes the same code path as
  # a developer's machine (see README, Requirements).
  # ------------------------------------------------------------------------
  matlab:
    name: MATLAB models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Optimization_Toolbox
          cache: true

      # No TTC_Data/ here (licensed): vd_selftest skips the tire-staleness
      # check, says so, and tests everything downstream of the tracked artifact.
      - name: Self-test (wiring)
        uses: matlab-actions/run-command@v3
        with:
          command: vd_setup; vd_selftest;

      # Runs every target and compares every number with the committed
      # baseline; on failure the log lists which values moved and by how much.
      - name: Golden values (regression)
        uses: matlab-actions/run-command@v3
        with:
          command: vd_setup; vd_golden;

      # Keep any figures the run produced.
      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plots
          path: plots/
          if-no-files-found: ignore
          retention-days: 14
